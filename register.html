<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Translate & Summarize News</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
  <style>
    body.auth-body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-image: url('https://img.freepik.com/free-vector/global-network-connection-world-map-digital-background_1017-23322.jpg');
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .auth-box {
      width: 320px;
      padding: 25px 30px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      color: white;
      text-align: center;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row input {
      flex: 1;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
    }

    input.valid {
      border-color: #28a745;
    }

    input.invalid {
      border-color: #ff4d4d;
    }

    .error-message {
      color: #ff4d4d;
      font-size: 12px;
      text-align: left;
      margin: 2px 0 5px 0;
    }

    .btn {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    .flash {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const fields = ['first_name', 'last_name', 'mobile', 'email', 'password', 'confirm_password'];

      fields.forEach(id => {
        document.getElementById(id).addEventListener('input', validateField);
      });
    });

    function showError(id, message) {
      const input = document.getElementById(id);
      const error = document.getElementById(id + '-error');
      if (message) {
        input.classList.remove('valid');
        input.classList.add('invalid');
        error.textContent = message;
      } else {
        input.classList.remove('invalid');
        input.classList.add('valid');
        error.textContent = '';
      }
    }
    function validateField(e) {
  const id = e.target.id;
  const val = e.target.value.trim();

  if (id === 'first_name' || id === 'last_name') {
    const nameRegex = /^[A-Z]+$/;
    showError(id, !nameRegex.test(val) ? 'Only UPPERCASE letters allowed' : '');
  }

  else if (id === 'mobile') {
    const mobileRegex = /^\+(?:[0-9] ?){6,14}[0-9]$/;
    if (!mobileRegex.test(val)) {
      showError(id, 'Enter valid mobile with +countrycode');
    } else if (val.startsWith('+91')) {
      const num = val.substring(3);
      if (!/^[789]\d{9}$/.test(num)) {
        showError(id, 'Indian number must start with 7/8/9 and be 10 digits');
      } else {
        showError(id, '');
        checkDuplicate('mobile');  // ✅ Call this here
      }
    } else {
      showError(id, '');
      checkDuplicate('mobile');  // ✅ Also for other countries
    }
  }

  else if (id === 'email') {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(val)) {
      showError(id, 'Enter a valid email');
    } else {
      showError(id, '');
      checkDuplicate('email');  // ✅ Call this here too
    }
  }

  else if (id === 'password') {
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
    showError(id, !passwordRegex.test(val) ? 'Min 8 characters with uppercase, lowercase, digit, symbol' : '');
  }

  else if (id === 'confirm_password') {
    const password = document.getElementById('password').value;
    showError(id, password !== val ? 'Passwords do not match' : '');
  }
}


    function validateForm() {
      let isValid = true;
      const inputs = document.querySelectorAll("input");

      inputs.forEach(input => {
        input.dispatchEvent(new Event("input")); // triggers real-time validation again
        if (input.classList.contains('invalid') || input.value.trim() === '') {
          isValid = false;
        }
      });
      return isValid;
    }


    // ✅ Add this block here
  async function checkDuplicate(field) {
    const val = document.getElementById(field).value.trim();
    if (!val) return;

    const payload = {};
    payload[field] = val;

    try {
      const res = await fetch('/check-duplicate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (data.status === 'error') {
        showError(field, data.message);
      } else {
        showError(field, '');
      }
    } catch (e) {
      console.error("Duplicate check error:", e);
    }
  }

  </script>
</head>

<body class="auth-body register-page">
  <div class="auth-box">
    <h2>Register</h2>
    <form action="/register" method="POST" onsubmit="return validateForm()" autocomplete="off">
      <div class="form-row">
        <div style="width: 50%">
          <input type="text" name="first_name" id="first_name" placeholder="First Name" required>
          <div class="error-message" id="first_name-error"></div>
        </div>
        <div style="width: 50%">
          <input type="text" name="last_name" id="last_name" placeholder="Last Name" required>
          <div class="error-message" id="last_name-error"></div>
        </div>
      </div>
    
      <input type="tel" name="mobile" id="mobile" placeholder="Mobile Number (e.g., +91XXXXXXXXXX)" required>
      <div class="error-message" id="mobile-error"></div>
    
      <input type="email" name="email" id="email" placeholder="Email ID" required>
      <div class="error-message" id="email-error"></div>
    
      <input type="password" name="password" id="password" placeholder="Password" required>
      <div class="error-message" id="password-error"></div>
    
      <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required>
      <div class="error-message" id="confirm_password-error"></div>
    
      <button class="btn" type="submit">Register</button>
      <p style="margin-top: 10px;">Already have an account? <a href="{{ url_for('login_page') }}">Login here</a></p>
    </form>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for message in messages %}
            {{ message }}<br>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    
  
  </div>
</body>
</html>
